gcs_bucket: dataservices-die-products

products:
  - id: nm_waterlevels_summary
    parameter: waterlevels
    output_type: ogc_summary
    title: "NM Unified Water Levels Summary"
    description: "Summary stats for water levels, all NM sources"
    abstract: >-
      Summary statistics for water levels across all sources in New Mexico, measured in ft.
      For each site it includes the minimum, maximum, mean, for the reporting period, as well as the date and value of the earliest and latest observations.
      The summary is updated every month on the 15th.
    schedule: "0 6 15 * *"
    spatial_filter:
      state: NM
    sources:
      exclude: []

  - id: nm_waterlevels_timeseries
    parameter: waterlevels
    output_type: ogc_timeseries
    title: "NM Water Levels Time Series"
    description: "Per-observation water level measurements, all NM sources"
    abstract: >-
      Per-observation water level measurements across all sources in New Mexico, measured in ft.
      Each observation includes the site, date, and water level value. Updated monthly on the 15th.
    schedule: "0 6 15 * *"
    spatial_filter:
      state: NM
    sources:
      exclude: []

  - id: nm_arsenic_summary
    parameter: arsenic
    output_type: ogc_summary
    title: "NM Arsenic Summary"
    description: "Arsenic concentration summary stats, all NM sources"
    abstract: >-
      Summary statistics for arsenic concentrations across all sources in New Mexico, measured in µg/L.
      For each site it includes the minimum, maximum, mean, for the reporting period, as well as the date and value of the earliest and latest observations.
      The summary is updated every month on the 25th.
    schedule: "0 6 25 * *"
    spatial_filter:
