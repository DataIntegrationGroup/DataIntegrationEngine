    sources:
      exclude: []

  # One feature per well; each major-ion analyte's latest value/units/date,
  # plus well depth, stored as properties. Analyte set is fixed in
  # assets/products.py (_MAJOR_CHEMISTRY), so no `parameter` here.
  - id: nm_major_chemistry
    output_type: ogc_major_chemistry
    title: "NM Major Chemistry"
    description: "Wells with major-ion chemistry (latest value per analyte), well depth, all NM sources"
    abstract: >-
      One feature per well with major-ion chemistry measurements, including the latest value for each analyte and the well depth.
      Major chemistry includes calcium, magnesium, sodium, potassium, bicarbonate, carbonate, chloride, and sulfate.
      Updated monthly on the 25th.

    schedule: "0 6 25 * *"
    spatial_filter:
      state: NM
    sources:
      exclude: []

  # One feature per well with a depth-to-water trend (slope_ft_per_year +
  # category) computed from each well's water-level timeseries. The collection
  # carries a trend_method description. Algorithm ported from the Ocotillo API
  # ogc_depth_to_water_trend_wells materialized view (see ogc_features.py).
  - id: nm_waterlevel_trends
    parameter: waterlevels
    output_type: ogc_waterlevel_trend
    title: "NM Water Level Trends"
    description: "Per-well depth-to-water trend (slope and category), all NM sources"
    abstract: >-
      One feature per well with depth-to-water measurements, labeled with the direction
      and rate of change of its water level. Each well's record is reduced to one value
      per day (the shallowest depth to water), then tested with the Mann-Kendall test
      (alpha = 0.05), with the rate given as a Theil-Sen slope in feet per year. Wells
      need at least 10 daily values, or at least 4 spanning 2 or more years; others are
      labeled "not enough data". Updated monthly. The trend is in depth to water, so
      "increasing" means the water level is falling.
    keywords: [water levels, depth to water, trend, Mann-Kendall, Theil-Sen]
    schedule: "0 6 15 * *"
    spatial_filter:
      state: NM
    sources:
      exclude: []

  # Per-well analyte concentration trend (Mann-Kendall + Theil-Sen, daily mean).
  # One product per analyte, driven by `parameter`.
  - id: nm_arsenic_trend
    parameter: arsenic
    output_type: ogc_analyte_trend
    publish: none
    title: "NM Arsenic Trends"
    description: "Per-well arsenic concentration trend (slope and category), all NM sources"
    abstract: >-
      Arsenic concentration trend per well. Observations are downsampled to one
      point per calendar day, keeping the daily MEAN concentration.
      Monotonic trend is tested with the non-parametric Mann-Kendall test
      (pymannkendall.original_test, alpha=0.05) on the daily series ordered by
      time; the rate is the Theil-Sen slope vs time. A well is classified only
      when it has at least 10 daily points, or at least 4 daily points spanning
      at least 2 years; otherwise 'not enough data'.
      A significant increasing slope is 'increasing', a 
      significant decreasing slope is 'decreasing', else 'stable'.
    schedule: "0 6 25 * *"
    spatial_filter:
      state: NM
    sources:
      exclude: []

