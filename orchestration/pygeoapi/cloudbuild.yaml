steps:
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'build'
      # Bakes products from GCS into the image; the cloudbuild network supplies
      # credentials (needs storage.objectViewer on the products bucket).
      - '--network=cloudbuild'
      - '--build-arg=BAKE_PRODUCTS=1'
      - '-t'
      - '$_REGION-docker.pkg.dev/$PROJECT_ID/die/die-pygeoapi:$COMMIT_SHA'
      - '-t'
      - '$_REGION-docker.pkg.dev/$PROJECT_ID/die/die-pygeoapi:latest'
      - '-f'
      - 'orchestration/pygeoapi/Dockerfile'
      - 'orchestration'   # build context holds pygeoapi/ and config/products.yaml

  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'push'
      - '--all-tags'
      - '$_REGION-docker.pkg.dev/$PROJECT_ID/die/die-pygeoapi'

  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: gcloud
    args:
      - 'run'
      - 'deploy'
      - 'die-pygeoapi'
      - '--image=$_REGION-docker.pkg.dev/$PROJECT_ID/die/die-pygeoapi:$COMMIT_SHA'
      - '--region=$_REGION'
      - '--platform=managed'
      - '--allow-unauthenticated'
      - '--port=80'
      - '--service-account=die-pygeoapi@$PROJECT_ID.iam.gserviceaccount.com'   # needs storage.objectViewer on the products bucket
      - '--memory=2Gi'
      # CPL_MACHINE_IS_GCE: GDAL can't detect Cloud Run as GCE, so /vsigs/ skips the
      # metadata-server credentials and every GeoJSON collection fails without it.
      # WSGI_WORKERS=2: the default 4 hit the 2 GiB cap under load locally.
      - '--set-env-vars=PYGEOAPI_SERVER_URL=https://die-pygeoapi-$PROJECT_NUMBER.$_REGION.run.app,CPL_MACHINE_IS_GCE=YES,WSGI_WORKERS=2'

substitutions:
  _REGION: us-central1

images:
  - '$_REGION-docker.pkg.dev/$PROJECT_ID/die/die-pygeoapi:$COMMIT_SHA'
  - '$_REGION-docker.pkg.dev/$PROJECT_ID/die/die-pygeoapi:latest'

options:
  logging: CLOUD_LOGGING_ONLY
